<div class="auth-container">
  <div class="auth-card">
    <h2>Criar conta</h2>
    <p class="subtitle">Cadastre-se para comprar e gerenciar pedidos</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input id="nome" type="text" formControlName="nome" placeholder="Seu nome completo" />
        <div class="error" *ngIf="form.get('nome')?.touched && form.get('nome')?.errors">
          <span *ngIf="form.get('nome')?.hasError('required')">Nome é obrigatório.</span>
          <span *ngIf="form.get('nome')?.hasError('minlength')">Mínimo de 2 caracteres.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="email@exemplo.com" />
        <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.errors">
          <span *ngIf="form.get('email')?.hasError('required')">Email é obrigatório.</span>
          <span *ngIf="form.get('email')?.hasError('email')">Email inválido.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input id="senha" type="password" formControlName="senha" placeholder="Mínimo 6 caracteres" />
        <div class="error" *ngIf="form.get('senha')?.touched && form.get('senha')?.errors">
          <span *ngIf="form.get('senha')?.hasError('required')">Senha é obrigatória.</span>
          <span *ngIf="form.get('senha')?.hasError('minlength')">Mínimo de 6 caracteres.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar senha</label>
        <input id="confirmarSenha" type="password" formControlName="confirmarSenha" placeholder="Repita a senha" />
        <div class="error" *ngIf="form.get('confirmarSenha')?.touched && form.get('confirmarSenha')?.errors">
          <span *ngIf="form.get('confirmarSenha')?.hasError('required')">Confirmação é obrigatória.</span>
        </div>
      </div>

      <button type="submit" [disabled]="loading || form.invalid">
        {{ loading ? 'Enviando...' : 'Criar conta' }}
      </button>

      <div class="helper">
        <span>Já tem conta?</span>
        <a routerLink="/login">Entrar</a>
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>
    </form>
  </div>
</div>
