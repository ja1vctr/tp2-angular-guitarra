<div class="auth-container">
  <div class="auth-card">
    <h2>Entrar</h2>
    <p class="subtitle">Acesse o painel administrativo</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="email@exemplo.com" />
        <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.errors">
          <span *ngIf="form.get('email')?.hasError('required')">Email é obrigatório.</span>
          <span *ngIf="form.get('email')?.hasError('email')">Email inválido.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input id="senha" type="password" formControlName="senha" placeholder="Sua senha" />
        <div class="error" *ngIf="form.get('senha')?.touched && form.get('senha')?.errors">
          <span *ngIf="form.get('senha')?.hasError('required')">Senha é obrigatória.</span>
        </div>
      </div>

      <button type="submit" [disabled]="loading || form.invalid">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>

      <div class="helper">
        <span>Não tem conta?</span>
        <a routerLink="/register">Crie uma agora</a>
      </div>

      <p class="error" *ngIf="error">{{ error }}</p>
    </form>
  </div>
</div>
