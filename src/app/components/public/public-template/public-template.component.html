<mat-sidenav-container class="admin-container">
  <app-header *ngIf="showChrome" />

  <mat-sidenav
    class="admin-sidenav"
    mode="side"
    position="end"
    [opened]="opened"
    [fixedInViewport]="true"
    fixedTopGap="0">
    <app-cart-sidenav />
  </mat-sidenav>

  <div class="admin-content" [class.fullscreen]="!showChrome">
    <router-outlet></router-outlet>
    <app-footer *ngIf="showChrome"></app-footer>
  </div>
</mat-sidenav-container>
