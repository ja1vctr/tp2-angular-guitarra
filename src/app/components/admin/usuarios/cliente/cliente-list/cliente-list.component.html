<div class="container">
  <div class="card">
    <div class="card-header">
      <div class="header-content">
        <div>
          <h2 class="card-title">Clientes</h2>
          <p class="card-description">Gerencie os clientes cadastrados</p>
        </div>
        <button class="btn btn-primary" (click)="navigateToCreate()">
          <mat-icon>add</mat-icon>
          Novo cliente
        </button>
      </div>
    </div>

    <div class="card-search">
      <input
        type="text"
        class="search-input"
        placeholder="Pesquise por nome"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange($event)" />
    </div>

    <div class="card-body">
      <div *ngIf="loading" class="loading-container">
        <div class="spinner-border" role="status">
          <span class="visually-hidden"></span>
        </div>
        <p class="loading-text">Carregando...</p>
      </div>

      <div *ngIf="!loading && clientes.length === 0" class="empty-message">
        <i class="bi bi-info-circle"></i>
        <span>Nenhum cliente encontrado.</span>
      </div>

      <div *ngIf="!loading && clientes.length > 0" class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>CPF</th>
              <th>Data Nasc.</th>
              <th class="actions-column">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let cliente of clientes">
              <td>{{ cliente.id }}</td>
              <td>{{ cliente.nome }}</td>
              <td>{{ cliente.email }}</td>
              <td>{{ cliente.cpf }}</td>
              <td>{{ cliente.dataNascimento | date: 'dd/MM/yyyy' }}</td>
              <td class="actions-column">
                <div class="action-buttons">
                  <button mat-button class="btn btn-edit" (click)="navigateToEdit(cliente.id!)">
                    <mat-icon>edit</mat-icon>
                  </button>
                  <button mat-button class="btn btn-delete" (click)="deleteCliente(cliente.id!)">
                    <mat-icon>delete</mat-icon>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <mat-paginator
          class="paginador"
          [pageSizeOptions]="[5, 10, 15, 20]"
          [pageSize]="pageSize"
          [pageIndex]="page"
          [length]="totalRecords"
          (page)="paginar($event)">
        </mat-paginator>
      </div>
    </div>
  </div>
</div>
