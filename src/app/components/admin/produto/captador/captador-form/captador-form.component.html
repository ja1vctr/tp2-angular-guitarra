<div class="container">
  <div class="form-header">
    <h2 class="form-title">
      {{ captadorId ? 'Editar Captador' : 'Novo Captador' }}
    </h2>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center mt-4 loading-indicator">
    <div class="spinner-border" role="status">
      <span class="visually-hidden"></span> 
    </div>
  </div>

  <!-- Form -->
  <form [formGroup]="captadorForm" (ngSubmit)="onSubmit()" class="form-grid" *ngIf="!loading">

    <!-- MARCA -->
    <div class="form-group">
      <label class="form-label" for="marca">Marca</label>
      <input class="form-input" type="text" id="marca" formControlName="marca" placeholder="Marca do captador">

      <div class="error-message" *ngIf="captadorForm.get('marca')?.touched && captadorForm.get('marca')?.errors">
        <span *ngIf="captadorForm.get('marca')?.hasError('required')">Marca é obrigatória.</span>
        <span *ngIf="captadorForm.get('marca')?.hasError('minlength')">Mínimo de 2 caracteres.</span>
        <span *ngIf="captadorForm.get('marca')?.hasError('maxlength')">Máximo de 50 caracteres.</span>
      </div>
    </div>

    <!-- MODELO -->
    <div class="form-group">
      <label class="form-label" for="modelo">Modelo</label>
      <input class="form-input" type="text" id="modelo" formControlName="modelo" placeholder="Modelo do captador">

      <div class="error-message" *ngIf="captadorForm.get('modelo')?.touched && captadorForm.get('modelo')?.errors">
        <span *ngIf="captadorForm.get('modelo')?.hasError('required')">Modelo é obrigatório.</span>
        <span *ngIf="captadorForm.get('modelo')?.hasError('minlength')">Mínimo de 2 caracteres.</span>
        <span *ngIf="captadorForm.get('modelo')?.hasError('maxlength')">Máximo de 50 caracteres.</span>
      </div>
    </div>

    <!-- POSIÇÃO -->
    <div class="form-group">
      <label class="form-label" for="posicao">Posição</label>

      <select class="form-input" id="posicao" formControlName="posicao">
        <option [value]="1">Braço</option>
        <option [value]="2">Meio</option>
        <option [value]="3">Ponte</option>
      </select>
      <div class="error-message" *ngIf="captadorForm.get('posicao')?.touched && captadorForm.get('posicao')?.errors">
        <span *ngIf="captadorForm.get('posicao')?.hasError('required')">Posição é obrigatória.</span>
      </div>
    </div>

    <!-- Botões -->
    <div class="button-group">
      <button type="submit" class="btn btn-primary" [disabled]="captadorForm.invalid || loading">
        {{ loading ? 'Salvando...' : (captadorId ? 'Salvar Alterações' : 'Salvar') }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancelar
      </button>
    </div>

  </form>
</div>
