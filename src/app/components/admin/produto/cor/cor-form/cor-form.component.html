<div class="container">
  <div class="form-header">
    <h2 class="form-title">
      {{ corId ? 'Editar Cor' : 'Nova Cor' }}
    </h2>
  </div>
  <div *ngIf="loading" class="text-center mt-4 loading-indicator">
    <div class="spinner-border" role="status">
      <span class="visually-hidden"></span> 
    </div>
  </div>

  <form [formGroup]="corForm" (ngSubmit)="onSubmit()" class="form-grid" *ngIf="!loading">

    <div class="form-group">
      <label class="form-label" for="nome">Nome</label>
      <input class="form-input" type="text" id="nome" formControlName="nome" placeholder="Nome da Cor">
      
      <div class="error-message" *ngIf="corForm.get('nome')?.touched && corForm.get('nome')?.errors">
        <span *ngIf="corForm.get('nome')?.hasError('required')">Nome é obrigatório.</span>
        <span *ngIf="corForm.get('nome')?.hasError('minlength')">Mínimo de 2 caracteres.</span>
        <span *ngIf="corForm.get('nome')?.hasError('maxlength')">Mínimo de 40 caracteres.</span>
      </div>
    </div>
    
    <div class="form-group">
      <label class="form-label" for="codigoHexadecimal">Código</label> 
      <input class="form-input" type="text" id="codigoHexadecimal" formControlName="codigoHexadecimal" placeholder="ex: #000000">
      
      <div class="error-message" *ngIf="corForm.get('codigoHexadecimal')?.touched && corForm.get('codigoHexadecimal')?.errors">
        <span *ngIf="corForm.get('codigoHexadecimal')?.hasError('required')">Código é obrigatório.</span>
        <span *ngIf="corForm.get('codigoHexadecimal')?.hasError('maxlength')">Máximo de 6 caracteres.</span>
        <span *ngIf="corForm.get('codigoHexadecimal')?.hasError('pattern')">O código hexadecimal deve ter dígitos VÁLIDOS.</span>
        <span *ngIf="corForm.get('codigoHexadecimal')?.hasError('backendError')">{{ corForm.get('codigoHexadecimal')?.getError('backendError') }}</span>
      </div>
    </div>
    <div class="button-group">
      <button type="submit" class="btn btn-primary" [disabled]="corForm.invalid || loading">
        {{ loading ? 'Salvando...' : (corId ? 'Salvar Alterações' : 'Salvar') }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancelar
      </button>
    </div>
  </form>
</div>
